name: Update YouTube videos
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/update_videos.py
      - name: Commit if changed
        run: |
          git config user.name "ibt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/videos.json data/playlists.json
          git diff --cached --quiet || (git commit -m "Auto: new YouTube videos" && git push)
