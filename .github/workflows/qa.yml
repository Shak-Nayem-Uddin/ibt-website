name: Update Islamic Q&A index
on:
  schedule:
    - cron: "41 20 * * *"   # daily, ~2:41 am Dhaka
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: qa, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/build_qa.py
      - name: Commit if changed
        run: |
          git config user.name "ibt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/qa.json tools/qa_state.json
          git diff --cached --quiet || (git commit -m "Auto: Islamic Q&A index" && git pull --rebase && git push)
