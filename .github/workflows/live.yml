name: Check YouTube live
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: live, cancel-in-progress: true }
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/check_live.py
      - name: Commit if changed
        run: |
          git config user.name "ibt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || (git commit -m "Auto: live status" && git pull --rebase && git push)
